<style>

.aura{position:fixed;top:-150px;left:50%;width:580px;height:470px;transform:translateX(-50%);pointer-events:none;z-index:0;filter:blur(38px);opacity:.8;background:radial-gradient(closest-side at 32% 58%,rgba(255,186,138,.7),transparent),radial-gradient(closest-side at 70% 42%,rgba(170,176,246,.6),transparent),radial-gradient(closest-side at 52% 76%,rgba(246,170,196,.5),transparent)}
#app{position:relative;z-index:1;max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-block:14px 168px}
.h1{margin:0;font-weight:300;font-size:34px;line-height:1.14;letter-spacing:-.025em;text-wrap:balance}
.h2{margin:0;font-weight:400;font-size:23px;line-height:1.2;letter-spacing:-.02em}
.big{font-size:44px;font-weight:300;letter-spacing:-.035em;line-height:1}
.lead{margin:0;color:var(--muted);line-height:1.5;font-size:15.5px;text-wrap:pretty}

.gi{width:100%;display:flex;align-items:center;gap:14px;padding:16px 16px 16px 22px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:var(--ink)}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(388px,calc(100% - 32px));height:66px;border-radius:33px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:0 20px;z-index:5;box-shadow:0 10px 30px rgba(22,23,27,.12)}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(388px,calc(100% - 32px));padding:8px;border-radius:28px;display:flex;gap:8px;z-index:5;box-shadow:0 10px 30px rgba(22,23,27,.12)}
.dock .btn{height:52px}

.fab{width:56px;height:56px;padding:0;border-radius:50%;border:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(22,23,27,.28)}
.menuwrap{position:relative;flex:none}
.pop{position:absolute;right:0;top:52px;z-index:7;min-width:210px;background:var(--surface);border-radius:20px;box-shadow:0 14px 40px rgba(22,23,27,.16);padding:6px}
.fabwrap .pop{top:auto;bottom:66px;min-width:236px}
.pop button{white-space:nowrap}
.pop .who{padding:10px 12px;font-size:13px;color:var(--faint);border-bottom:1px solid var(--line);margin-bottom:4px}
.pop button{display:flex;align-items:center;gap:10px;width:100%;height:46px;padding:0 12px;border:0;background:transparent;border-radius:14px;font-size:15px;font-weight:500;color:var(--ink);text-align:left}
.pop button:hover{background:var(--soft)}
.undo{border:0;background:transparent;color:#fff;font-size:14.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:0;flex:none}
.toast{display:flex;align-items:center;justify-content:space-between;gap:14px;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 40px));padding:14px 18px;border-radius:18px;background:var(--ink);color:#fff;font-size:14.5px;font-weight:500;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv span:first-child{color:var(--faint)}
.kv span:last-child{font-weight:500;text-align:right}
.note{margin-top:18px;padding:16px 18px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);font-size:15px;line-height:1.45}
.qty{height:54px;display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:16px;background:var(--surface)}
.qty button{width:44px;height:100%;border:0;background:transparent;font-size:20px}
.step{display:flex;align-items:center;gap:12px;padding:13px 0;font-size:15px}
.dot,.cb{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--line-strong);background:transparent;display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
.cb{width:26px;height:26px}
.dot.done,.cb.done{background:var(--ink);border-color:var(--ink)}
.toggle{width:52px;height:32px;flex:none;border:0;border-radius:16px;padding:3px;display:flex;justify-content:flex-start;background:var(--line-strong)}
.toggle.on{background:var(--ink);justify-content:flex-end}
.toggle span{width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ico{flex:none;display:inline-block;vertical-align:middle}
.boot{flex:1;display:flex;align-items:center;justify-content:center}
.boot .sphere{width:120px;height:120px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.92);opacity:.75}}
@media (prefers-reduced-motion:reduce){.boot .sphere{animation:none}}
</style>

<script>
(function(){
const CATS=['Skincare','Clothing','Home','Tech','Books','Other'];
const CATL={All:'Tudo',Skincare:'Skincare',Clothing:'Roupas',Home:'Casa',Tech:'Tecnologia',Books:'Livros',Other:'Outros'};
const PRL={Low:'Baixa',Medium:'Média',High:'Alta'};
const FILTERS=['All'].concat(CATS);
const SORTS=[['recent','Recentes'],['priceAsc','Menor preço'],['priceDesc','Maior preço'],['priority','Prioridade']];
const ICONS={
 All:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 Skincare:'<path d="M12 2.7s-6 6.3-6 10.3a6 6 0 0 0 12 0c0-4-6-10.3-6-10.3z"/><path d="M9 14.5a3 3 0 0 0 3 2.5"/>',

};

 book:'<path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',

 share:'<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',

function ic(p,s,w){return '<svg class="ico" width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||1.8)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';}
function catIcon(c,size,sw){return ic(ICONS[c]||ICONS.Other,size||16,sw||1.8);}
const HEARTF='<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+P.heart+'</svg>';
const UI={name:'',pin:'',friend:'',book:{title:'',pages:'',base:'0'},goal:{daily:'',period:''},log:{bid:'',from:'',to:'',date:''}};
let S=fresh();
let timer=null, toastT=null, lastKey='', saveT=null, saving=false, pendingSave=false;

/* ---------- API ---------- */
function api(method,path,body){
  var opts={method:method,credentials:'same-origin',headers:{}};
  if(body!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}
  return fetch(path,opts).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){
      if(!r.ok){var e=new Error((j&&j.error)||'Algo deu errado. Tente de novo.');e.status=r.status;throw e;}
      return j;
    });
  },function(){var e=new Error('Problema de conexão. Tente de novo.');e.code='unavailable';throw e;});
}

function fresh(){return {user:null,booting:false,tab:'home',filter:'All',sort:'recent',items:[],books:[],logs:[],rgoal:null,rp:{mode:'week',off:0},shareCat:'All',view:null,menu:null,busy:false,err:'',toast:''};}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function cl(c){return CATL[c]||c;}
function money(n){var v=parseFloat(n);return isNaN(v)?'—':'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2});}
function slugify(n){return n.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80);}
function errMsg(e){if(e&&e.code==='unavailable')return 'Problema de conexão. Tente de novo.';if(e&&e.code==='quota_exceeded')return 'Armazenamento cheio. Tente mais tarde.';return (e&&e.message)||'Algo deu errado. Tente de novo.';}
function host(url){try{return new URL(/^https?:/i.test(url)?url:'https://'+url).hostname.replace(/^www\./,'');}catch(e){return url;}}
function safeUrl(u){u=String(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{var x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:'';}catch(e){return '';}}
function imgUrl(u){u=String(u||'').trim();if(!/^https?:\/\//i.test(u))return '';try{return new URL(u).href;}catch(e){return '';}}
function photo(u){var s=imgUrl(u);return s?'<img src="'+esc(s)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">':'';}
function parse(url){
  var u=null;try{u=new URL(/^https?:/i.test(url)?url:'https://'+url);}catch(e){}
  var h=host(url);
  var segs=u?u.pathname.split('/').filter(Boolean).reverse():[], t='';
  for(var i=0;i<segs.length&&!t;i++){
    var seg=segs[i];try{seg=decodeURIComponent(seg);}catch(e){}
    if(/^(dp|p|gp|product|products|produto|produtos|item|itens|pd)$/i.test(seg))continue;
    t=seg.replace(/\.[a-z]+$/i,'').replace(/[-_+]+/g,' ').replace(/\b\w*\d\w*\b/g,'').replace(/\s+/g,' ').trim();
  }
  var st=h.split('.')[0]||'';
  return {title:t?t[0].toUpperCase()+t.slice(1):'',price:'',store:st?st[0].toUpperCase()+st.slice(1):'',variant:'',category:'Other',qty:1,priority:'Medium',note:'',source:h,image:''};
}
function sorted(arr){
  var a=arr.slice();
  if(S.sort==='priceAsc')return a.sort(function(x,y){return (parseFloat(x.price)||0)-(parseFloat(y.price)||0);});
  if(S.sort==='priceDesc')return a.sort(function(x,y){return (parseFloat(y.price)||0)-(parseFloat(x.price)||0);});
  if(S.sort==='priority'){var r={High:0,Medium:1,Low:2};return a.sort(function(x,y){return (r[x.priority]==null?1:r[x.priority])-(r[y.priority]==null?1:r[y.priority]);});}
  return a;
}
function visible(arr){return sorted(S.filter==='All'?arr:arr.filter(function(i){return i.category===S.filter;}));}
function chips(){return FILTERS.map(function(c){return '<button class="chip'+(c===S.filter?' on':'')+'" data-act="filter" data-v="'+esc(c)+'" aria-pressed="'+(c===S.filter)+'">'+catIcon(c,16)+esc(cl(c))+'</button>';}).join('');}
function resBar(left){
  var cur=SORTS.find(function(s){return s[0]===S.sort;})||SORTS[0], open=S.menu==='sort';
  return '<div class="resbar"><span class="s">'+left+'</span><div class="menuwrap"><button class="sortbtn" data-act="menu-sort" aria-haspopup="menu" aria-expanded="'+open+'" aria-label="Ordenar por '+cur[1]+'">'+ic(P.sortI,16)+cur[1]+ic(P.down,14)+'</button>'+
   (open?'<div class="pop sm" role="menu"><div class="who">Ordenar por</div>'+SORTS.map(function(s){var on=S.sort===s[0];return '<button role="menuitemradio" aria-checked="'+on+'" data-act="sort" data-v="'+s[0]+'">'+s[1]+(on?'<span class="ck">'+ic(P.check,16,2.2)+'</span>':'')+'</button>';}).join('')+'</div>':'')+'</div></div>';
}
function countLbl(n){return n+(n===1?' item':' itens')+(S.filter==='All'?'':' em '+esc(cl(S.filter)));}
function field(l,inner){return '<label class="field"><span>'+l+'</span>'+inner+'</label>';}
function backBtn(act){return '<button class="circ" data-act="'+(act||'back')+'" aria-label="Voltar">'+ic(P.back,18)+'</button>';}
function pageHead(title,sub,right){return '<div class="head"><div style="min-width:0">'+(sub?'<div class="s" style="margin-bottom:6px">'+sub+'</div>':'')+'<h1 class="h1">'+title+'</h1></div>'+(right||'')+'</div>';}
function kv(r){return '<div class="kv"><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>';}
function pad2(n){return n<10?'0'+n:String(n);}
function first(n){return String(n).trim().split(/\s+/)[0];}

function toast(msg){
  S.toast=msg; S.undo=null; render();
  clearTimeout(toastT);
  toastT=setTimeout(function(){S.toast='';render();},2200);
}
function removeWithUndo(patch,msg){
  var prev={};Object.keys(patch).forEach(function(k){prev[k]=S[k];});
  save(patch); S.undo=prev; S.toast=msg; render();
  clearTimeout(toastT); toastT=setTimeout(function(){S.toast='';S.undo=null;render();},5000);
}
function persistBody(){return {items:S.items,books:S.books,logs:S.logs,rgoal:S.rgoal};}

/* ---------- salvar (com debounce) ---------- */
function save(patch){
  if(patch)Object.assign(S,patch);
  render();
  if(!S.user)return;
  clearTimeout(saveT);
  saveT=setTimeout(flushSave,400);
}
function flushSave(){
  clearTimeout(saveT); saveT=null;
  if(!S.user)return Promise.resolve();
  if(saving){pendingSave=true;return Promise.resolve();}
  saving=true;
  return api('PUT','/api/space',persistBody()).catch(function(e){
    toast(e.status===401?'Sua sessão expirou. Saia e entre de novo para salvar.':errMsg(e));
  }).then(function(){
    saving=false;
    if(pendingSave){pendingSave=false;return flushSave();}
  });
}
window.addEventListener('pagehide',function(){
  if(!saveT||!S.user)return;
  clearTimeout(saveT); saveT=null;
  try{fetch('/api/space',{method:'PUT',keepalive:true,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(persistBody())});}catch(e){}
});

/* ---------- entrar / sair ---------- */
function applySpace(r){
  var d=(r&&r.data)||{};
  Object.assign(S,{user:{name:r.name,slug:r.slug},items:d.items||[],books:d.books||[],logs:d.logs||[],rgoal:d.rgoal||{daily:10,weeks:{},months:{}}});
}
async function enter(){
  var name=UI.name.trim(), pin=UI.pin.trim();
  if(!name){S.err='Digite seu nome.';return render();}
  if(!/^\d{4}$/.test(pin)){S.err='O PIN precisa ter 4 dígitos.';return render();}
  if(!slugify(name)){S.err='Use letras ou números no nome.';return render();}
  if(S.busy)return;
  S.busy=true;S.err='';render();
  try{
    var r=await api('POST','/api/space/enter',{name:name,pin:pin});
    applySpace(r);
    S.busy=false;UI.pin='';
    try{localStorage.setItem('wl-name',r.name||name);}catch(e){}
    render();
  }catch(e){S.busy=false;S.err=errMsg(e);render();}
}
function signOut(){
  clearInterval(timer);
  var pending=saveT&&S.user?persistBody():null;
  clearTimeout(saveT); saveT=null;
  (pending?api('PUT','/api/space',pending).catch(function(){}):Promise.resolve())
    .then(function(){return api('POST','/api/space/logout').catch(function(){});});
  S=fresh();UI.pin='';render();
}

/* ---------- link -> detalhes ---------- */
function cleanDetails(r){
  var out={};
  if(!r||typeof r!=='object')return out;
  if(typeof r.title==='string'&&r.title.trim())out.title=r.title.trim();
  if(r.price!=null){var p=String(r.price).replace(/[^0-9.]/g,'');if(p)out.price=p;}
  if(typeof r.store==='string'&&r.store.trim())out.store=r.store.trim();
  if(typeof r.variant==='string'&&r.variant.trim())out.variant=r.variant.trim();
  if(CATS.indexOf(r.category)>-1)out.category=r.category;
  var im=imgUrl(r.image); if(im)out.image=im;
  return out;
}
function fillDetails(){
  var v=S.view, url=(v.url||'').trim();
  if(!url)return;
  v.stage='loading'; v.step=0; v.host=host(url); v.failed=false;
  render();
  clearInterval(timer);
  var done=false, result=null;
  api('POST','/api/space/link',{url:url})
    .then(function(r){result=r;if(!r||r.failed)v.failed=true;})
    .catch(function(){v.failed=true;})
    .then(function(){done=true;});
  timer=setInterval(function(){
    if(S.view!==v){clearInterval(timer);return;}
    if(done){
      clearInterval(timer);
      v.draft=Object.assign(parse(url),cleanDetails(result));
      v.stage='form';
      if(v.failed)toast('Não foi possível ler a página. Confira os campos.');
      else if(!(result&&result.price))toast('Não achamos o preço. Confira os campos.');
      render();
      return;
    }
    v.step=Math.min(v.step+1,4);
    render();
  },340);
}
function saveDraft(){
  var d=S.view.draft;
  if(!d||!d.title||!d.title.trim())return;
  var item=Object.assign({},d,{id:'n'+Date.now(),url:safeUrl(S.view.url)});
  clearInterval(timer);
  save({items:[item].concat(S.items),view:null});
  toast('Salvo na wishlist');
}
/* ---------- leitura ---------- */
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESL=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function dk(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addD(key,n){var p=key.split('-').map(Number);return dk(new Date(p[0],p[1]-1,p[2]+n));}
function weekStart(key){var dow=new Date(key+'T12:00:00').getDay();return addD(key,-((dow+6)%7));}
function dim(mk){var p=mk.split('-').map(Number);return new Date(p[0],p[1],0).getDate();}
function monthAdd(mk,n){var p=mk.split('-').map(Number);var d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function wkLbl(s){var e=addD(s,6),a=s.split('-').map(Number),b=e.split('-').map(Number);return a[1]===b[1]?a[2]+'–'+b[2]+' '+MES[a[1]-1]:a[2]+' '+MES[a[1]-1]+' – '+b[2]+' '+MES[b[1]-1];}
function moLbl(mk){var p=mk.split('-').map(Number);return MESL[p[1]-1]+' '+p[0];}
function G(){var g=S.rgoal||{};return {daily:g.daily||10,weeks:g.weeks||{},months:g.months||{}};}
function dayGoalRaw(d){var g=G(),wk=weekStart(d),mk=d.slice(0,7);if(g.weeks[wk]!=null)return g.weeks[wk]/7;if(g.months[mk]!=null)return g.months[mk]/dim(mk);return g.daily;}
function dg(d){return Math.ceil(dayGoalRaw(d));}
function periodDays(){
  if(S.rp.mode==='week'){var s=addD(weekStart(dk()),S.rp.off*7),o=[];for(var i=0;i<7;i++)o.push(addD(s,i));return o;}
  var mk=monthAdd(dk().slice(0,7),S.rp.off),n=dim(mk),r=[];for(var j=1;j<=n;j++)r.push(mk+'-'+String(j).padStart(2,'0'));return r;
}
function periodKey(days){return S.rp.mode==='week'?days[0]:days[0].slice(0,7);}
function periodLabel(days){return S.rp.mode==='week'?wkLbl(days[0]):moLbl(days[0].slice(0,7));}
function periodOverride(key){var g=G(),m=S.rp.mode==='week'?g.weeks:g.months;return m[key]!=null?m[key]:null;}
function periodGoal(days){var o=periodOverride(periodKey(days));if(o!=null)return o;return Math.round(days.reduce(function(a,d){return a+dayGoalRaw(d);},0));}
function weekStats(){var t=dk(),s=weekStart(t),d=[];for(var i=0;i<7;i++)d.push(addD(s,i));var r=d.reduce(function(a,x){return a+pagesOn(x);},0);var o=G().weeks[s];return {read:r,goal:o!=null?o:Math.round(d.reduce(function(a,x){return a+dayGoalRaw(x);},0))};}
function pagesOn(day,bid){return S.logs.reduce(function(a,l){return a+((!bid||l.bid===bid)&&l.date===day?(l.to-l.from+1):0);},0);}
function bookCur(b){var m=b.base||0;S.logs.forEach(function(l){if(l.bid===b.id&&l.to>m)m=l.to;});return m;}
function activeBooks(){return S.books.filter(function(b){return !b.done;});}
function streak(){var d=dk();if(!pagesOn(d))d=addD(d,-1);var n=0;while(pagesOn(d)>0){n++;d=addD(d,-1);}return n;}
function bookAdd(){
  var f=UI.book, title=(f.title||'').trim(), pages=parseInt(f.pages,10), base=parseInt(f.base,10)||0;
  if(!title)return toast('Dê um nome ao livro.');
  if(!(pages>0))return toast('Informe o total de páginas.');
  if(base>=pages)return toast('A página atual precisa ser antes da última.');
  var b={id:'b'+Date.now(),title:title,pages:pages,base:base,done:false};
  UI.book={title:'',pages:'',base:'0'};
  save({books:S.books.concat([b]),view:null});
  toast('Livro adicionado');
}
function setLogBook(bid){
  var b=S.books.find(function(x){return x.id===bid;});
  if(!b)return null;
  var cur=bookCur(b);
  UI.log.bid=bid; UI.log.from=String(cur+1); UI.log.to=String(Math.min(b.pages,cur+Math.max(1,dg(dk()))));
  return b;
}
function logOpen(bid){if(!setLogBook(bid))return;UI.log.date=dk();S.view={type:'logform'};render();}
function logPick(bid){if(setLogBook(bid))render();}
function logSave(){
  var f=UI.log, b=S.books.find(function(x){return x.id===f.bid;});
  if(!b)return toast('Escolha um livro.');
  var from=parseInt(f.from,10), to=parseInt(f.to,10), cur=bookCur(b);
  if(!(from>=1)||!(to>=from))return toast('A página final precisa vir depois da inicial.');
  if(to>b.pages)return toast('Essa página passa do fim do livro.');
  if(from<=cur)return toast('Comece depois da página '+cur+', onde você parou.');
  var log={id:'l'+Date.now(),bid:b.id,date:f.date||dk(),from:from,to:to};
  UI.log={bid:'',from:'',to:'',date:''};
  save({logs:S.logs.concat([log]),view:null});
  var n=to-from+1; toast(n+(n===1?' página registrada':' páginas registradas'));
}
function goalOpen(){var o=periodOverride(periodKey(periodDays()));UI.goal={daily:String(G().daily),period:o!=null?String(o):''};S.view={type:'goalform'};render();}
function goalSave(){
  var daily=parseInt(UI.goal.daily,10); if(!(daily>0))return toast('Informe a meta diária.');
  var days=periodDays(), key=periodKey(days), slot=S.rp.mode==='week'?'weeks':'months', g0=G();
  var g={daily:daily,weeks:Object.assign({},g0.weeks),months:Object.assign({},g0.months)};
  var raw=String(UI.goal.period||'').trim();
  if(raw===''){delete g[slot][key];}else{var n=parseInt(raw,10);if(!(n>0))return toast('A meta do período precisa ser um número.');g[slot][key]=n;}
  save({rgoal:g,view:null}); toast('Metas salvas');
}
function goalDel(slot,key){var g0=G(),g={daily:g0.daily,weeks:Object.assign({},g0.weeks),months:Object.assign({},g0.months)};delete g[slot][key];save({rgoal:g});}

function shareText(){
  var cat=S.shareCat||'All', items=S.items.filter(function(i){return cat==='All'||i.category===cat;});
  var groups=cat==='All'?CATS.filter(function(c){return items.some(function(i){return i.category===c;});}):[cat];
  var out=['Wishlist de '+S.user.name+(cat==='All'?'':' · '+cl(cat))];
  groups.forEach(function(c){
    out.push('',cl(c));
    items.filter(function(i){return i.category===c;}).forEach(function(i){
      var parts=[i.title];
      if(parseFloat(i.price))parts.push(money(i.price));
      if(i.store)parts.push(i.store);
      if(i.variant)parts.push(i.variant);
      if(i.qty>1)parts.push(i.qty+' unidades');
      out.push('- '+parts.join(' · ')+(i.priority==='High'?' (quero muito)':''));
      var u=safeUrl(i.url); if(u)out.push('  '+u);
      if(i.note)out.push('  Obs.: '+i.note);
    });
  });
  return {text:out.join('\n'),count:items.length};
}
function copyShare(){
  var txt=shareText().text;
  function fallback(){
    var ta=document.getElementById('share-text');
    if(ta){ta.focus();ta.select();try{if(document.execCommand('copy'))return toast('Texto copiado');}catch(e){}}
    toast('Texto selecionado. Copie pelo menu do sistema.');
  }
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(function(){toast('Texto copiado');},fallback);else fallback();
}
function sendShare(){

  else copyShare();
}

  return formTop('Novo livro')+'<div class="stack">'+
   field('Título','<input class="input" data-bf="title" value="'+esc(f.title)+'" placeholder="Nome do livro">')+
   '<div class="grid2">'+field('Total de páginas','<input class="input" inputmode="numeric" data-bf="pages" value="'+esc(f.pages)+'" placeholder="320">')+field('Página atual','<input class="input" inputmode="numeric" data-bf="base" value="'+esc(f.base)+'">')+'</div>'+
   '<p class="s" style="margin:0;line-height:1.45">Se você já começou, coloque a última página que leu. Se está começando agora, deixe 0. A meta de páginas fica em Metas e vale para todos os livros.</p>'+
   '<button class="btn" data-act="book-save">Adicionar livro</button></div>';
}
function logFormView(){
  var f=UI.log, act=activeBooks();
  var pick=act.length?'<div class="row" style="flex-wrap:wrap">'+act.map(function(b){return '<button class="chip'+(f.bid===b.id?' on':'')+'" data-act="log-pick" data-i="'+esc(b.id)+'" aria-pressed="'+(f.bid===b.id)+'">'+esc(b.title)+'</button>';}).join('')+'</div>':'<p class="s" style="margin:0">Adicione um livro primeiro.</p>';
  return formTop('Registrar<br>leitura')+'<div class="stack">'+
   '<div class="field"><span>Livro</span>'+pick+'</div>'+
   '<div class="grid2">'+field('Página inicial','<input class="input" inputmode="numeric" data-lf="from" value="'+esc(f.from)+'">')+field('Página final','<input class="input" inputmode="numeric" data-lf="to" value="'+esc(f.to)+'">')+'</div>'+
   field('Data','<input class="input" type="date" data-lf="date" value="'+esc(f.date)+'">')+
   '<p class="s" style="margin:0;line-height:1.45">Páginas lidas = final − inicial + 1. Da página 1 à 10 são 10 páginas.</p>'+
   '<button class="btn" data-act="log-save"'+(act.length?'':' disabled')+'>Salvar leitura</button></div>';
}
function goalFormView(){
  var days=periodDays(), wk=S.rp.mode==='week', lbl=wk?'a semana '+periodLabel(days):periodLabel(days).toLowerCase(), g=G(), rows=[];
  Object.keys(g.weeks).sort().forEach(function(k){rows.push(['weeks',k,'Semana '+wkLbl(k),g.weeks[k]]);});
  Object.keys(g.months).sort().forEach(function(k){rows.push(['months',k,moLbl(k),g.months[k]]);});
  return formTop('Metas de<br>leitura')+'<div class="stack">'+
   field('Meta diária padrão (páginas)','<input class="input" inputmode="numeric" data-gf="daily" value="'+esc(UI.goal.daily)+'">')+
   '<p class="s" style="margin:-6px 0 0;line-height:1.45">Vale para os dias que não estão numa semana ou mês com meta própria.</p>'+
   field('Meta total para '+esc(lbl),'<input class="input" inputmode="numeric" data-gf="period" value="'+esc(UI.goal.period)+'" placeholder="Vazio = usar a meta padrão">')+
   '<p class="s" style="margin:-6px 0 0;line-height:1.45">O total é dividido igualmente entre os dias. Se uma semana e um mês tiverem meta própria, vale a da semana.</p>'+
   '<button class="btn" data-act="goal-save">Salvar metas</button>'+
   (rows.length?'<div class="s" style="font-weight:500;margin:10px 4px 0">Metas próprias definidas</div><div class="group">'+rows.map(function(r){return '<div class="gi"><span class="val" style="flex:1">'+esc(r[2])+'</span><span class="s">'+r[3]+' págs</span><button class="link" data-act="goal-del" data-v="'+r[0]+'|'+r[1]+'">Remover</button></div>';}).join('')+'</div>':'')+
   '</div>';
}

function navBar(){
  var tabs=[['home',P.home,'Início'],['mine',P.heart,'Wishlist'],['reading',P.book,'Leitura']];
  return '<nav class="nav glass" aria-label="Seções">'+tabs.map(function(x){var on=S.tab===x[0];return '<button class="'+(on?'on':'')+'" data-act="tab" data-v="'+x[0]+'" aria-label="'+x[2]+'"'+(on?' aria-current="page"':'')+'>'+ic(x[1],22,1.8)+'</button>';}).join('')+'</nav>';
}
function render(){
  var app=document.getElementById('app'), html;
  if(S.booting){html=bootView();}
  else if(!S.user){html=loginView();}
  else if(S.view){
    var t=S.view.type;
    html=t==='item'?itemView():t==='add'?addView():t==='share'?shareView():t==='bookform'?bookFormView():t==='logform'?logFormView():t==='goalform'?goalFormView():t==='book'?bookView():'';
    if(!html){S.view=null;return render();}
  }else{
    html=({home:homeView,mine:mineView,reading:readingView}[S.tab]||homeView)();
  }
  app.innerHTML=html+(S.user&&!S.view?navBar():'')+(S.toast?'<div class="toast" role="status"><span>'+esc(S.toast)+'</span>'+(S.undo?'<button class="undo" data-act="undo">Desfazer</button>':'')+'</div>':'');
  var key=(S.user?'u':'')+'|'+S.tab+'|'+(S.view?S.view.type+(S.view.id||S.view.slug||''):'');
  if(key!==lastKey){lastKey=key;window.scrollTo(0,0);}
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(S.menu&&!e.target.closest('.menuwrap,.fabwrap')){S.menu=null;if(!el||el.disabled)return render();}
  if(!el||el.disabled)return;
  var a=el.getAttribute('data-act'), v=el.getAttribute('data-v');
  switch(a){
    case 'enter': return enter();
    case 'signout': return signOut();
    case 'tab': S.tab=v; S.view=null; S.menu=null; return render();
    case 'home-week': S.tab='reading'; S.rp={mode:'week',off:0}; S.view=null; return render();
    case 'filter': S.filter=v; return render();
    case 'sort': S.sort=v; S.menu=null; return render();
    case 'menu-sort': S.menu=S.menu==='sort'?null:'sort'; return render();
    case 'open': S.view={type:'item',id:el.getAttribute('data-id')}; return render();
    case 'back': S.view=null; return render();
    case 'menu-user': S.menu=S.menu==='user'?null:'user'; return render();
    case 'menu-fab': S.menu=S.menu==='fab'?null:'fab'; return render();
    case 'share': S.menu=null; S.shareCat='All'; S.view={type:'share'}; return render();
    case 'share-cat': S.shareCat=v; return render();
    case 'share-copy': return copyShare();
    case 'share-go': return sendShare();
    case 'add-open': S.menu=null; S.view={type:'add',stage:'paste',url:'',draft:null}; return render();
    case 'cancel-add': clearInterval(timer); S.view=null; return render();
    case 'example': S.view.url=v; return fillDetails();
    case 'fetch': if((S.view.url||'').trim()) fillDetails(); return;
    case 'manual': S.view.stage='form'; S.view.draft={title:'',price:'',store:'',variant:'',qty:1,priority:'Medium',note:'',source:'',image:'',category:S.filter==='All'?'Other':S.filter}; return render();
    case 'draft-cat': S.view.draft.category=v; return render();
    case 'draft-prio': S.view.draft.priority=v; return render();
    case 'qty': S.view.draft.qty=Math.min(99,Math.max(1,(S.view.draft.qty||1)+parseInt(v,10))); return render();
    case 'save-draft': return saveDraft();
    case 'remove': return removeWithUndo({items:S.items.filter(function(i){return i.id!==v;}),view:null},'Item removido');
    case 'book-new': S.menu=null; UI.book={title:'',pages:'',base:'0'}; S.view={type:'bookform'}; return render();
    case 'book-save': return bookAdd();
    case 'log-open': S.menu=null; return logOpen(el.getAttribute('data-i'));
    case 'log-pick': return logPick(el.getAttribute('data-i'));
    case 'log-save': return logSave();
    case 'book-done': var did=el.getAttribute('data-i'); return save({books:S.books.map(function(b){return b.id===did?Object.assign({},b,{done:true}):b;})});
    case 'book-remove': var bid=el.getAttribute('data-i'); return removeWithUndo({books:S.books.filter(function(b){return b.id!==bid;}),logs:S.logs.filter(function(l){return l.bid!==bid;}),view:null},'Livro apagado');
    case 'book-open': S.menu=null; S.view={type:'book',id:el.getAttribute('data-i')}; return render();
    case 'log-del': var lid=el.getAttribute('data-i'); return removeWithUndo({logs:S.logs.filter(function(l){return l.id!==lid;})},'Registro apagado');
    case 'undo': var u=S.undo; if(!u)return; S.undo=null; S.toast=''; clearTimeout(toastT); return save(u);
    case 'rp-mode': S.rp={mode:v,off:0}; return render();
    case 'rp-nav': S.rp.off+=parseInt(v,10); return render();
    case 'goal-open': return goalOpen();
    case 'goal-save': return goalSave();
    case 'goal-del': var gp=v.split('|'); return goalDel(gp[0],gp[1]);
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.hasAttribute('data-ui')){UI[t.getAttribute('data-ui')]=t.value;S.err='';return;}
  if(t.hasAttribute('data-bf')){UI.book[t.getAttribute('data-bf')]=t.value;return;}
  if(t.hasAttribute('data-gf')){UI.goal[t.getAttribute('data-gf')]=t.value;return;}
  if(t.hasAttribute('data-lf')){UI.log[t.getAttribute('data-lf')]=t.value;return;}
  if(t.hasAttribute('data-url')){S.view.url=t.value;return;}
  if(t.hasAttribute('data-draft')){S.view.draft[t.getAttribute('data-draft')]=(t.getAttribute('data-draft')==='price')?t.value.replace(/[^0-9.]/g,''):t.value;return;}
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.target.tagName==='TEXTAREA')return;
  var t=e.target;
  if(t.hasAttribute('data-ui')&&!S.user)return enter();
  if(t.hasAttribute('data-bf'))return bookAdd();
  if(t.hasAttribute('data-lf'))return logSave();
  if(t.hasAttribute('data-gf'))return goalSave();
  if(t.hasAttribute('data-url')&&S.view&&(S.view.url||'').trim())return fillDetails();
});

/* ---------- início ---------- */
try{var saved=localStorage.getItem('wl-name');if(saved)UI.name=saved;}catch(e){}
S.booting=true;
render();
api('GET','/api/space').then(function(r){if(r&&r.slug)applySpace(r);}).catch(function(){}).then(function(){S.booting=false;render();});
})();
</script>
</body>
</html>
